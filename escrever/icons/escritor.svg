<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Escritor · ícone no padrão dos aplicativos do GNOME (HIG):
       vista de frente, cores chapadas da paleta Adwaita, luz de cima
       e a espessura do objeto como uma faixa mais escura embaixo. -->
  <defs>
    <linearGradient id="capa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/><stop offset=".12" stop-color="#3584e4"/><stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="corpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffa348"/><stop offset=".5" stop-color="#ff7800"/><stop offset=".5" stop-color="#e66100"/><stop offset="1" stop-color="#e66100"/>
    </linearGradient>
    <linearGradient id="madeira" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbe1b4"/><stop offset=".5" stop-color="#f6d6a3"/><stop offset=".5" stop-color="#e5bf86"/><stop offset="1" stop-color="#e5bf86"/>
    </linearGradient>
    <linearGradient id="ponteira" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#deddda"/><stop offset=".5" stop-color="#deddda"/><stop offset=".5" stop-color="#9a9996"/><stop offset="1" stop-color="#9a9996"/>
    </linearGradient>
  </defs>

  <!-- capa azul, com a espessura embaixo -->
  <rect x="22" y="14" width="86" height="104" rx="10" fill="#1a5fb4"/>
  <rect x="22" y="10" width="86" height="102" rx="10" fill="url(#capa)"/>

  <!-- folha, com o maço de páginas por baixo -->
  <rect x="34" y="16" width="66" height="92" rx="5" fill="#c0bfbc"/>
  <rect x="34" y="14" width="66" height="90" rx="5" fill="#ffffff"/>

  <!-- texto escrito: título e linhas -->
  <g fill="#9a9996">
    <rect x="44" y="27" width="38" height="5" rx="2.5" fill="#5e5c64"/>
    <rect x="44" y="40" width="46" height="4" rx="2"/>
    <rect x="44" y="50" width="42" height="4" rx="2"/>
    <rect x="44" y="60" width="46" height="4" rx="2"/>
    <rect x="44" y="70" width="30" height="4" rx="2"/>
    <rect x="44" y="80" width="18" height="4" rx="2"/>
  </g>

  <!-- espiral -->
  <g>
    <g fill="#77767b">
      <rect x="16" y="26" width="24" height="8" rx="4"/>
      <rect x="16" y="44" width="24" height="8" rx="4"/>
      <rect x="16" y="62" width="24" height="8" rx="4"/>
      <rect x="16" y="80" width="24" height="8" rx="4"/>
    </g>
    <g fill="#deddda">
      <rect x="16" y="24" width="24" height="8" rx="4"/>
      <rect x="16" y="42" width="24" height="8" rx="4"/>
      <rect x="16" y="60" width="24" height="8" rx="4"/>
      <rect x="16" y="78" width="24" height="8" rx="4"/>
    </g>
  </g>

  <!-- lápis, escrevendo no fim da última linha -->
  <g transform="translate(72 74) rotate(-135)">
    <!-- sombra do lápis na folha -->
    <path d="M-7 4 L0 -12 L7 4 V62 a3 3 0 0 1 -3 3 H-4 a3 3 0 0 1 -3 -3 Z" fill="#241f31" opacity=".12" transform="translate(3 -3)"/>
    <path d="M-7 4 L0 -12 L7 4 Z" fill="url(#madeira)"/>
    <path d="M-2.6 -6 L0 -12 L2.6 -6 Z" fill="#3d3846"/>
    <rect x="-7" y="4" width="14" height="46" fill="url(#corpo)"/>
    <rect x="-7" y="50" width="14" height="6" fill="url(#ponteira)"/>
    <path d="M-7 56 H7 V61 a4 4 0 0 1 -4 4 H-3 a4 4 0 0 1 -4 -4 Z" fill="#f66151"/>
    <path d="M0 56 H7 V61 a4 4 0 0 1 -4 4 H0 Z" fill="#e01b24"/>
  </g>
</svg>
